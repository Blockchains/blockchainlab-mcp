name: docker
on:
  push: { branches: [main], tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/blockchains/blockchainlab-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v7
        with: { context: ., load: true, tags: "blockchainlab-mcp:test" }
      - name: Smoke test — MCP initialize + tools/list over stdio inside the container
        run: |
          out=$( (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 3) | docker run -i --rm blockchainlab-mcp:test 2>/dev/null)
          echo "$out" | head -c 400; echo
          n=$(echo "$out" | grep '"id":2' | python3 -c "import sys,json; print(len(json.loads(sys.stdin.read())['result']['tools']))")
          echo "tools: $n"; test "$n" -ge 43
      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with: { context: ., push: true, platforms: "linux/amd64,linux/arm64", tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}" }
