version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    ignore:
      # test/types.test.mjs uses the TypeScript 5 compiler API to generate/check types/*.d.ts; move to 6/7 deliberately
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns: ["*"]
